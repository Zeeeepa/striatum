# Vendors the shared documentation convention, pinned by SHA (single source:
# github.com/halbritt/doc-convention-lint). Phase 1 = warn-only: the hook reports
# misfiled/un-front-mattered docs but does not block. Flip to fail-closed (drop the
# --warn-only arg) at migration Phase 4, once the tree is structurally migrated.
repos:
  - repo: https://github.com/halbritt/doc-convention-lint
    rev: 03781e40506355cc5414ed97f65729fbda34c926
    hooks:
      - id: doc-convention
        args: [--warn-only]
