name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Release metadata
        run: python scripts/release_metadata_check.py
      - name: Package smoke
        run: PYTHON_FOR_BUILD=python scripts/package_smoke.sh
      - name: Fresh-clone smoke
        run: scripts/fresh_clone_smoke.sh
