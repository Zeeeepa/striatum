name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  go:
    name: Go build, test, and smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: striatum
          POSTGRES_PASSWORD: striatum
          POSTGRES_DB: striatum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U striatum -d striatum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STRIATUM_PG_TEST_URL: postgres://striatum:striatum@localhost:5432/striatum_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: binary
          args: --version

      - name: Go vet, test, race, lint, and coverage
        run: make -C go check

      - name: Build release archive
        run: make release-archives

      - name: Check release archive
        run: make check-release-archives

      - name: Go package smoke
        run: make package-smoke

      - name: Fresh clone smoke
        run: make smoke

  frontend:
    name: Frontend bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/striatum/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make ui-install

      - name: Build and verify committed bundle
        run: make ui-check-bundle

      - name: Frontend tests
        run: make ui-test
