name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12"]
    # D105: Python is the production daemon core. Go CI is helper-focused;
    # the old CORE=go multi-repo parity axis is intentionally not a release
    # gate. The Postgres service remains for the Python multi-repo harness.
    # STRIATUM_MULTI_REPO_REQUIRE_PG=1 converts missing-PG skips to failures.
    # GitHub-hosted macOS runners don't support `services:`, so the
    # multi-repo step is Linux-only.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Make the harness's pg.resolve_base_url() find the service when
      # present. Empty on macOS where services don't run; the multi-repo
      # step is skipped there via the matrix gate below.
      STRIATUM_TEST_POSTGRES_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        with:
          # go/go.mod requires 1.23.
          go-version: "1.23"
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/striatum/web/frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,daemon-pg]"
      - name: Go helper check
        run: make daemon-go-helper-check
      - name: Multi-repo harness (CORE=python)
        # macOS GitHub-hosted runners can't run services:, so the
        # multi-repo step is Linux-only. Without the Postgres service the
        # STRIATUM_MULTI_REPO_REQUIRE_PG=1 below would intentionally fail
        # — exactly what the harness guardrail wants. Run only on Ubuntu.
        if: matrix.os == 'ubuntu-latest'
        env:
          STRIATUM_MULTI_REPO_REQUIRE_PG: "1"
        run: make test-multi-repo CORE=python
      - name: Go helper PG integration
        if: matrix.os == 'ubuntu-latest'
        env:
          STRIATUM_MULTI_REPO_REQUIRE_PG: "1"
        run: make daemon-go-helper-integration
      - name: UI install
        run: make ui-install
      - name: UI build hash check
        run: make ui-check-bundle
      - name: UI tests
        run: make ui-test
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Release metadata
        run: python scripts/release_metadata_check.py
      - name: Package smoke
        run: PYTHON_FOR_BUILD=python scripts/package_smoke.sh
      - name: Fresh-clone smoke
        run: scripts/fresh_clone_smoke.sh
