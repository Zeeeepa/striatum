name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12"]
        # RFC 0039 Phase 2 Step 6: daemon_core matrix axis. Both python and
        # go run as explicit jobs (not in-process parametrization) so an
        # all-skipped pass cannot occur (dogfood-047 F3 finding).
        daemon-core: ["python", "go"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        if: matrix.daemon-core == 'go'
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/striatum/web/frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build Go daemon
        if: matrix.daemon-core == 'go'
        run: make daemon-go-build
      - name: Go tests
        if: matrix.daemon-core == 'go'
        run: make daemon-go-test
      - name: Multi-repo harness (CORE=${{ matrix.daemon-core }})
        env:
          # RFC 0039 Phase 2 Step 6 / dogfood-047 F3: hard-fail-on-missing-PG
          # sentinel so an all-skipped pass cannot occur on the go axis.
          STRIATUM_MULTI_REPO_REQUIRE_PG: "1"
        run: make test-multi-repo CORE=${{ matrix.daemon-core }}
      - name: UI install
        run: make ui-install
      - name: UI build hash check
        run: make ui-check-bundle
      - name: UI tests
        run: make ui-test
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Release metadata
        run: python scripts/release_metadata_check.py
      - name: Package smoke
        run: PYTHON_FOR_BUILD=python scripts/package_smoke.sh
      - name: Fresh-clone smoke
        run: scripts/fresh_clone_smoke.sh
