name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  go:
    name: Go build, test, and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go tests
        run: make check

      - name: Build release archive
        run: make release-archives

      - name: Check release archive
        run: make check-release-archives

      - name: Go package smoke
        run: make package-smoke

      - name: Fresh clone smoke
        run: make smoke

      - name: Guard no active Python trace
        run: make python-trace-guardrail

  frontend:
    name: Frontend bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/striatum/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make ui-install

      - name: Build and verify committed bundle
        run: make ui-check-bundle

      - name: Frontend tests
        run: make ui-test
