name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12"]
        # RFC 0039 Phase 2 Step 6: daemon_core matrix axis. Both python and
        # go run as explicit jobs (not in-process parametrization) so an
        # all-skipped pass cannot occur (dogfood-047 F3 finding).
        daemon-core: ["python", "go"]
    # RFC 0039 V1.6 F3/F5 (dogfood-047): a Postgres service so the
    # multi-repo harness can boot ephemeral databases. STRIATUM_MULTI_REPO_REQUIRE_PG=1
    # (set below) converts harness skips to failures so a missing-PG CI
    # environment can no longer masquerade as a green run. GitHub-hosted
    # macOS runners don't support `services:`, so the multi-repo step is
    # gated on Linux only — the macOS jobs still run the in-process unit
    # tests + Go build + Go tests, just not the PG-backed multi-repo
    # matrix.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Make the harness's pg.resolve_base_url() find the service when
      # present. Empty on macOS where services don't run; the multi-repo
      # step is skipped there via the matrix gate below.
      STRIATUM_TEST_POSTGRES_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@v5
        if: matrix.daemon-core == 'go'
        with:
          # go/go.mod requires 1.23 (RFC 0039 V1.5 — Phase 2 / pgx).
          go-version: "1.23"
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/striatum/web/frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build Go daemon
        if: matrix.daemon-core == 'go'
        run: make daemon-go-build
      - name: Verify Go binary present (RFC 0039 V1.6 F-ci)
        if: matrix.daemon-core == 'go'
        # dogfood-049 gemini F6: don't let a silent no-op make-build cause
        # an all-skipped pass on the go matrix axis. Hard-fail here if
        # go/bin/striatumd is missing after the build step.
        run: |
          if [ ! -x go/bin/striatumd ]; then
            echo "::error::CORE=go selected but go/bin/striatumd is missing after make daemon-go-build" >&2
            exit 1
          fi
          echo "ok: go/bin/striatumd $(go/bin/striatumd --version 2>/dev/null || echo present)"
      - name: Go tests
        if: matrix.daemon-core == 'go'
        run: make daemon-go-test
      - name: Multi-repo harness (CORE=${{ matrix.daemon-core }})
        # macOS GitHub-hosted runners can't run services:, so the
        # multi-repo step is Linux-only. Without the Postgres service the
        # STRIATUM_MULTI_REPO_REQUIRE_PG=1 below would intentionally fail
        # — exactly what F3 wants. Run only on Ubuntu.
        if: matrix.os == 'ubuntu-latest'
        env:
          # RFC 0039 Phase 2 Step 6 / dogfood-047 F3: hard-fail-on-missing-PG
          # sentinel so an all-skipped pass cannot occur on the go axis.
          STRIATUM_MULTI_REPO_REQUIRE_PG: "1"
        run: make test-multi-repo CORE=${{ matrix.daemon-core }}
      - name: UI install
        run: make ui-install
      - name: UI build hash check
        run: make ui-check-bundle
      - name: UI tests
        run: make ui-test
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Release metadata
        run: python scripts/release_metadata_check.py
      - name: Package smoke
        run: PYTHON_FOR_BUILD=python scripts/package_smoke.sh
      - name: Fresh-clone smoke
        run: scripts/fresh_clone_smoke.sh
