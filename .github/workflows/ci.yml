name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  go:
    name: Go build, test, and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go tests
        run: make check

      - name: Build release archive
        run: make release-archives

      - name: Check release archive
        run: make check-release-archives

      - name: Go package smoke
        run: make package-smoke

      - name: Fresh clone smoke
        run: make smoke

      - name: Guard no active Python release path
        run: |
          pybuild='python -m'; pybuild="$pybuild build"
          publisher='pypa/gh-action'; publisher="$publisher-pypi-publish"
          tw='twi'; tw="${tw}ne"
          pip_install='pip install'; pip_install="$pip_install striatum-orchestrator"
          wheel_sdist='wheel +'; wheel_sdist="$wheel_sdist sdist"
          for needle in "$pybuild" "$publisher" "$tw" "$pip_install" "$wheel_sdist"; do
            ! grep -R --line-number -F "$needle" \
              Makefile .github/workflows/release.yml scripts README.md \
              docs/USING_STRIATUM.md docs/GETTING_STARTED.md docs/RELEASING.md
          done

  frontend:
    name: Frontend bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/striatum/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make ui-install

      - name: Build and verify committed bundle
        run: make ui-check-bundle

      - name: Frontend tests
        run: make ui-test
