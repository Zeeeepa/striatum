name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Go release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "$version" || {
            echo "tag $GITHUB_REF_NAME disagrees with VERSION $version" >&2
            exit 1
          }

      - name: Test
        run: make check

      - name: Build Go archives and checksums
        run: make release-archives

      - name: Check Go archives
        run: make check-release-archives

      - name: Smoke release archive
        run: make package-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: go-release-archives
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: go-release-archives
          path: dist/

      - name: Extract CHANGELOG slice for this version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" {capture=1}
            capture && /^## / && $0 !~ "^## " version "([[:space:]]|$)" {exit}
            capture {print}
          ' CHANGELOG.md)"
          if [[ -z "$body" ]]; then
            body="$(printf '## %s\n\nNo CHANGELOG entry found for this version.' "$version")"
          fi
          {
            echo "body<<EOF_CHANGELOG_SLICE"
            printf '%s\n' "$body"
            echo "EOF_CHANGELOG_SLICE"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
