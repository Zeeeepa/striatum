name: Installed CLI Gate

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installed-cli:
    name: Installed-CLI seat gate (agy + codex)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: striatum
          POSTGRES_PASSWORD: striatum
          POSTGRES_DB: striatum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U striatum -d striatum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STRIATUM_PG_TEST_URL: postgres://striatum:striatum@localhost:5432/striatum_test?sslmode=disable
      STRIATUM_P3_INSTALLED_CLI: "1"
      STRIATUM_P3_RUN_TIMEOUT: 4m
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install agy CLI
        run: |
          # The upstream installer now only accepts -d/--dir; the old
          # --skip-aliases/--skip-path flags were removed and made the step
          # fail with "Unknown parameter". The script installs to
          # $HOME/.local/bin by default and runs `agy install` as a non-fatal
          # PATH/alias handoff (it only warns when the dir is not yet on PATH),
          # so a bare invocation is sufficient here.
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version

      - name: Install codex CLI
        # The codex seat fixture (TestInstalledCLISeatCodexTwoTurn) drives the real
        # codex binary against a hermetic httptest MCP harness, so it needs codex on
        # PATH but no LLM auth. CIExecutedInstalledCLISeats lists codex, so the
        # seat-tier guard requires this fixture to actually run here (#358).
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Run installed-CLI conformance gate
        # make installed-cli-check runs the agy two-turn + agy restart-while-leased
        # (#151) + codex two-turn fixtures. Each skips cleanly if its CLI is missing.
        run: make installed-cli-check
