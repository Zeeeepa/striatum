{% extends "base.html" %}
{% block title %}New Workflow · Striatum{% endblock %}
{% block main %}
<section class="page-section workflow-new-page">
  <header>
    <p class="breadcrumb"><a href="/workflows">← Workflows</a></p>
    <h1>New Workflow</h1>
    <p class="run-meta">
      <span class="muted">Generate from the local workflow template catalog.</span>
    </p>
  </header>
  <div id="island-workflow-chooser" data-props='{{ {"allowMutations": allow_mutations, "templatesUrl": "/workflow-templates", "previewUrl": "/workflows/generate/preview", "generateUrl": "/workflows/generate"} | tojson }}'></div>
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/build/island-workflow-chooser.js"></script>
{% endblock %}
