[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "striatum-orchestrator"
version = "1.57.0"
description = "Local-first orchestration for terminal-based AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Hal Britt" },
]
keywords = ["ai-agents", "cli", "local-first", "orchestration", "postgres"]
urls.Homepage = "https://github.com/halbritt/striatum"
urls.Repository = "https://github.com/halbritt/striatum"
urls.Issues = "https://github.com/halbritt/striatum/issues"
urls.Changelog = "https://github.com/halbritt/striatum/blob/main/CHANGELOG.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = ["jinja2>=3.1", "markdown-it-py>=4.0"]

[project.optional-dependencies]
daemon-pg = [
  "psycopg[binary]>=3.2",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
striatum = "striatum.cli:main"
striatumd = "striatum.daemon_entrypoint:main"

[tool.setuptools.package-data]
"striatum.web.static" = ["*.html", "*.js", "*.css", "*.svg", "build/*.js", "build/*.css", "build/*.sha256"]
"striatum.web.static.build" = ["*.js", "*.css", "*.sha256"]
"striatum.web.templates" = ["*.html"]
"striatum.skills.templates" = ["*.md.tmpl", "**/*.md.tmpl"]
"striatum.plugins.templates" = ["*.tmpl", "**/*.tmpl"]
"striatum.scaffold.templates" = ["*.md.tmpl", "**/*.md.tmpl", "bin/*.sh"]
"striatum.daemon_rpc" = ["daemon_methods.json"]
"striatum.daemon_pg.sql" = ["*.sql"]
"striatum.workflow_templates" = ["*.json"]
"striatum._daemongo" = ["binaries/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "multi_repo: requires system PostgreSQL and the daemon multi-repo harness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# Optional third-party deps that don't ship type stubs. Imports are
# already gated at the call sites; allow them to be untyped without
# masking real bugs.
exclude = '(tests/_harness/pg\.py|tests/architecture/test_authority_guardrails\.py|tests/architecture/test_go_helper_boundary\.py|tests/daemon_pg/handlers/reads/test_pg_read_dashboard\.py|tests/daemon_pg/handlers/recovery_evidence/conftest\.py|tests/daemon_pg/handlers/test_lane_liveness_attestation\.py|tests/daemon_pg/handlers/test_supervision\.py|tests/daemon_pg/test_append_only_role_grants\.py|tests/daemon_pg/test_capability_denial_matrix\.py|tests/daemon_pg/test_migration_0010_artifact_blob_update\.py|tests/test_artifact_schemas\.py|tests/test_cli_mvp\.py|tests/test_daemon_go_startup\.py|tests/test_override_modal_context_validation\.py|tests/test_process_adapter\.py|tests/test_run_detail_recovery_panel\.py|tests/test_scaffold_ddd_layout\.py|tests/test_service\.py|tests/test_skills_install\.py)'
[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true
