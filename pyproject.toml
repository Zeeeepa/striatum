[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "striatum-orchestrator"
version = "1.29.0"
description = "Local-first orchestration for terminal-based AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Hal Britt" },
]
keywords = ["ai-agents", "cli", "local-first", "orchestration", "sqlite"]
urls.Homepage = "https://github.com/halbritt/striatum"
urls.Repository = "https://github.com/halbritt/striatum"
urls.Issues = "https://github.com/halbritt/striatum/issues"
urls.Changelog = "https://github.com/halbritt/striatum/blob/main/CHANGELOG.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = ["jinja2>=3.1", "markdown-it-py>=4.0"]

[project.optional-dependencies]
daemon-pg = [
  "psycopg[binary]>=3.2",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
striatum = "striatum.cli:main"
striatumd = "striatum.daemon:main"

[tool.setuptools.package-data]
"striatum.web.static" = ["*.html", "*.js", "*.css", "*.svg"]
"striatum.web.templates" = ["*.html"]
"striatum.skills.templates" = ["*.md.tmpl", "**/*.md.tmpl"]
"striatum.plugins.templates" = ["*.tmpl", "**/*.tmpl"]
"striatum.scaffold.templates" = ["*.md.tmpl", "**/*.md.tmpl"]
"striatum.daemon_pg.sql" = ["*.sql"]
"striatum.workflow_templates" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "multi_repo: requires system PostgreSQL and the daemon multi-repo harness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
