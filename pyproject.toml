[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "striatum-orchestrator"
version = "1.57.0"
description = "Local-first orchestration for terminal-based AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Hal Britt" },
]
keywords = ["ai-agents", "cli", "local-first", "orchestration", "postgres"]
urls.Homepage = "https://github.com/halbritt/striatum"
urls.Repository = "https://github.com/halbritt/striatum"
urls.Issues = "https://github.com/halbritt/striatum/issues"
urls.Changelog = "https://github.com/halbritt/striatum/blob/main/CHANGELOG.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = ["jinja2>=3.1", "markdown-it-py>=4.0"]

[project.optional-dependencies]
daemon-pg = [
  "psycopg[binary]>=3.2",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
striatum = "striatum.cli:main"
striatumd = "striatum.daemon_entrypoint:main"

[tool.setuptools.package-data]
"striatum.web.static" = ["*.html", "*.js", "*.css", "*.svg", "build/*.js", "build/*.css", "build/*.sha256"]
"striatum.web.static.build" = ["*.js", "*.css", "*.sha256"]
"striatum.web.templates" = ["*.html"]
"striatum.skills.templates" = ["*.md.tmpl", "**/*.md.tmpl"]
"striatum.plugins.templates" = ["*.tmpl", "**/*.tmpl"]
"striatum.scaffold.templates" = ["*.md.tmpl", "**/*.md.tmpl", "bin/*.sh"]
"striatum.daemon_rpc" = ["daemon_methods.json"]
"striatum.daemon_pg.sql" = ["*.sql"]
"striatum.workflow_templates" = ["*.json"]
"striatum._daemongo" = ["binaries/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "multi_repo: requires system PostgreSQL and the daemon multi-repo harness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# Optional third-party deps that don't ship type stubs. Imports are
# already gated at the call sites; allow them to be untyped without
# masking real bugs.
exclude = '(tests/_harness/pg\.py|tests/architecture/test_authority_guardrails\.py|tests/architecture/test_go_helper_boundary\.py|tests/daemon_pg/handlers/reads/test_pg_read_dashboard\.py|tests/daemon_pg/handlers/recovery_evidence/conftest\.py|tests/daemon_pg/handlers/recovery_evidence/test_evidence_export\.py|tests/daemon_pg/handlers/test_lane_liveness_attestation\.py|tests/daemon_pg/handlers/test_supervision\.py|tests/daemon_pg/test_append_only_role_grants\.py|tests/daemon_pg/test_capability_denial_matrix\.py|tests/daemon_pg/test_migration_0010_artifact_blob_update\.py|tests/daemon_rpc/test_registry_rfc0043_coverage\.py|tests/exit_codes/test_rfc0043_split_brain\.py|tests/fixtures/v1_repo_local_sqlite/build_fixture\.py|tests/test_artifact_schemas\.py|tests/test_artifact_view_provenance_trail\.py|tests/test_byline_regression\.py|tests/test_chat_tools\.py|tests/test_cli_corpus_export\.py|tests/test_cli_mvp\.py|tests/test_cli_run_cancel\.py|tests/test_copy_on_click\.py|tests/test_corpus_export_integration\.py|tests/test_daemon_go_startup\.py|tests/test_daemon_rpc\.py|tests/test_dashboard\.py|tests/test_dashboard_web_parity\.py|tests/test_decision_propagation\.py|tests/test_dogfood_publish_on_behalf\.py|tests/test_dogfood_surgical_recovery\.py|tests/test_gh14_terminal_blocker_recovery\.py|tests/test_gh7_terminal_blocker\.py|tests/test_gh8_v16_rebuild_idempotent\.py|tests/test_harness_profiles\.py|tests/test_harness_v2_fixes\.py|tests/test_invoke_csrf_refused\.py|tests/test_job_detail_expected_artifacts\.py|tests/test_lane_evidence_guard\.py|tests/test_list_commands\.py|tests/test_override_modal_context_validation\.py|tests/test_override_rationale_regression\.py|tests/test_pause_resume\.py|tests/test_posture_verdicts_override_provenance\.py|tests/test_process_adapter\.py|tests/test_recovery_auto\.py|tests/test_recovery_dry_run_no_side_effects\.py|tests/test_recovery_extended\.py|tests/test_recovery_panel_dry_run\.py|tests/test_recovery_resume\.py|tests/test_retry_job\.py|tests/test_review_postures\.py|tests/test_review_postures_introspection\.py|tests/test_reviewer_policy\.py|tests/test_run_detail_recovery_panel\.py|tests/test_scaffold_ddd_layout\.py|tests/test_service\.py|tests/test_session_close\.py|tests/test_skills_install\.py|tests/test_supervise\.py|tests/test_supervised_progress_watcher\.py|tests/test_view_file_breadcrumb_heuristic\.py|tests/test_web_chat\.py|tests/test_web_ergonomics\.py|tests/test_web_run_cancel\.py|tests/test_web_run_pause_resume\.py|tests/test_web_run_posture_verdicts\.py|tests/test_web_ui\.py|tests/test_web_ui_redesign\.py|tests/test_web_view\.py|tests/test_web_workflow_run\.py|tests/test_web_workflows\.py|tests/test_worktree_isolation\.py)'
[[tool.mypy.overrides]]
module = ["keyring", "keyring.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true
