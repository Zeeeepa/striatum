# RFC 0162 game-day fire test — `promtool test rules` proof that each lane-auth
# alert actually fires on its synthetic trigger (the RFC's mandatory acceptance
# criterion: "an alert that has never fired is a liability"). Reproducible, no
# production daemon required. Run:
#   promtool test rules go/pkg/metrics/rules/rfc0162_alerts_gameday_test.yaml
#
# This complements the committed /metrics golden render test (proving the exporter
# EMITS the eight families) by proving the six proximal alert rules FIRE end-to-end
# from synthetic series. The live Alertmanager -> Slack path is the existing,
# already-live RFC 0137 routing; deploying the lane-auth exporter to the running
# striatumd is gated on the daemon's next owner-DDL deploy (out of RFC 0162 scope).
rule_files:
  - alerting_rules.yml

evaluation_interval: 1m

tests:
  # GD-1 (motivating incident, L1 ⭐): a real OAuth lane whose seconds_to_expiry is
  # below the operator-declared lead -> LaneCredExpirySoon fires WHILE healthy.
  - interval: 1m
    input_series:
      - series: 'striatum_lane_cred_seconds_to_expiry{lane="striatum-lane",kind="oauth"}'
        values: '18000x20'          # 5h remaining, held
      - series: 'striatum_lane_cred_expiry_lead_seconds{lane="striatum-lane"}'
        values: '28800x20'          # 8h lead -> 5h < 8h -> trips
    alert_rule_test:
      - eval_time: 16m
        alertname: LaneCredExpirySoon
        exp_alerts:
          - exp_labels:
              severity: page
              lane: striatum-lane
              kind: oauth
            exp_annotations:
              summary: "lane striatum-lane OAuth credential expiring soon"
              description: "seconds_to_expiry crossed the declared expiry lead; renew the lane credential before it expires."

  # GD-3 (renewer silently stopped, days early): seconds_to_expiry trends DOWN over
  # 6h instead of being topped up -> LaneCredRenewalStalled fires before the lead
  # tripwire would. delta() over a gauge is a direct trend read.
  - interval: 15m
    input_series:
      # 32400 -> declining 900s every 15m over 8h (renewer dead, no top-up)
      - series: 'striatum_lane_cred_seconds_to_expiry{lane="striatum-lane",kind="oauth"}'
        values: '32400-900x32'
    alert_rule_test:
      - eval_time: 8h
        alertname: LaneCredRenewalStalled
        exp_alerts:
          - exp_labels:
              severity: page
              lane: striatum-lane
              kind: oauth
            exp_annotations:
              summary: "lane striatum-lane credential renewal appears stalled"
              description: "seconds_to_expiry is trending down over 6h; the renewer may have stopped while the token is still valid."

  # GD-1b (F1 census / absence): a rostered lane emits no sample_present ->
  # LaneAuthSampleMissing fires WITH THE LANE NAMED (label-preserving unless on(lane)).
  - interval: 1m
    input_series:
      - series: 'striatum_lane_auth_expected{lane="agy",provider="agy",kind="api_key"}'
        values: '1x15'
      # no striatum_lane_cred_sample_present for lane="agy" -> the unless leaves it
    alert_rule_test:
      - eval_time: 11m
        alertname: LaneAuthSampleMissing
        exp_alerts:
          - exp_labels:
              severity: page
              lane: agy
              provider: agy
              kind: api_key
            exp_annotations:
              summary: "rostered lane agy produced no auth sample"
              description: "A rostered lane emitted no sample_present this window; its credential may have vanished."

  # GD-1b control: a HEALTHY api_key lane (sample_present=1) must NOT page.
  - interval: 1m
    input_series:
      - series: 'striatum_lane_auth_expected{lane="agy",provider="agy",kind="api_key"}'
        values: '1x15'
      - series: 'striatum_lane_cred_sample_present{lane="agy",kind="api_key"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: LaneAuthSampleMissing
        exp_alerts: []

  # GD-2b (F2 fail-closed): an unprovable runtime credential source pages, never
  # reads green -> LaneCredResolverMismatch fires.
  - interval: 1m
    input_series:
      - series: 'striatum_lane_cred_resolver_mismatch{lane="gemini",kind="oauth"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: LaneCredResolverMismatch
        exp_alerts:
          - exp_labels:
              severity: page
              lane: gemini
              kind: oauth
            exp_annotations:
              summary: "lane gemini credential resolver mismatch"
              description: "The runtime credential source for this lane could not be proven; no green gauge is emitted for it."

  # GD-5 (L3 codex heartbeat): a codex lane's last real auth success is older than
  # its declared staleness threshold -> LaneAuthHeartbeatStale fires.
  - interval: 1m
    input_series:
      # promtool anchors time() at epoch 0, so at eval_time=16m time()=960s. A
      # last_success at t=0 with a 300s threshold => time()-last_success (960) > 300
      # holds from t>5m; pending >= the 10m `for` by 16m -> fires.
      - series: 'striatum_lane_auth_last_success_timestamp_seconds{lane="striatum-lane"}'
        values: '0x20'
      - series: 'striatum_lane_auth_staleness_threshold_seconds{lane="striatum-lane"}'
        values: '300x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: LaneAuthHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: page
              lane: striatum-lane
            exp_annotations:
              summary: "lane striatum-lane auth heartbeat stale"
              description: "No real auth success for this lane within its declared staleness threshold."

  # GD-4 (shared-fate): the exporter being down / the census vector absent pages as
  # loudly as a stale value -> LaneAuthExporterDown fires from absent(expected).
  - interval: 1m
    input_series:
      # deliberately NO striatum_lane_auth_expected series at all (exporter blind);
      # seed an unrelated series so the test block has input.
      - series: 'striatum_metrics_snapshot_age_seconds'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LaneAuthExporterDown
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "striatumd lane-auth exporter is down or emitting no expected vector"
              description: "The lane-auth census vector is absent or the exporter is unscrapeable; lane-auth observability is blind."
