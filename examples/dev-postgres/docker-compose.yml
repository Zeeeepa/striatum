services:
  postgres:
    image: postgres:16
    container_name: striatum-dev-postgres
    environment:
      POSTGRES_DB: striatum_daemon
      POSTGRES_USER: striatum_admin
      POSTGRES_PASSWORD: striatum_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - striatum-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U striatum_admin -d striatum_daemon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  striatum-dev-postgres:
